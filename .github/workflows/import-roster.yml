name: Import Roster

# Imports a student roster into production.
#
# The roster is held in the ALLIANCE_ROSTER repository *secret*, never in the repository
# itself: this repo is public and a roster carries students' names, register numbers and
# LeetCode handles. GitHub masks secret values in logs, so the data reaches production
# without ever being committed or printed.
#
# Manual only. Defaults to a dry run, which reports exactly what would change and writes
# nothing — always look at that before setting dry-run to false.
on:
  workflow_dispatch:
    inputs:
      campusCode:
        description: 'Campus code these students belong to (e.g. SRM, VELS, ALLIANCE)'
        required: true
        type: string
      campusName:
        description: 'Full name — ONLY needed to create a campus that does not exist yet (e.g. "Alliance University"). Leave blank for an existing campus.'
        required: false
        type: string
      archiveAbsent:
        description: 'RECONCILE — the secret holds this campus’s COMPLETE roster; archive anyone active there and absent from it. Leave OFF for a partial roster.'
        required: true
        default: false
        type: boolean
      dryRun:
        description: 'Report what would change without writing'
        required: true
        default: true
        type: boolean

concurrency:
  group: import-roster
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import roster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate configuration
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROSTER: ${{ secrets.ALLIANCE_ROSTER }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${BACKEND_URL:-}" ] && { echo "::error::BACKEND_URL is not set"; missing=1; }
          [ -z "${CRON_SECRET:-}" ] && { echo "::error::CRON_SECRET is not set"; missing=1; }
          [ -z "${ROSTER:-}" ]      && { echo "::error::ALLIANCE_ROSTER is not set"; missing=1; }
          [ "$missing" -eq 1 ] && exit 1
          echo "Configuration present."

      - name: Import
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROSTER: ${{ secrets.ALLIANCE_ROSTER }}
          CAMPUS: ${{ inputs.campusCode }}
          CAMPUS_NAME: ${{ inputs.campusName }}
          DRY_RUN: ${{ inputs.dryRun }}
          ARCHIVE_ABSENT: ${{ inputs.archiveAbsent }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}"

          # Build the payload in Python rather than the shell: names contain spaces and
          # punctuation, and hand-rolled JSON quoting is how a roster gets silently mangled.
          python3 - <<'PY'
          import csv, io, json, os

          roster = os.environ['ROSTER']
          rows = []
          for row in csv.DictReader(io.StringIO(roster)):
              lower = { (k or '').strip().lower(): (v or '').strip() for k, v in row.items() }
              name = lower.get('name', '')
              if not name:
                  continue
              rows.append({
                  'name': name,
                  'email': lower.get('email', ''),
                  'squad': lower.get('squad', ''),
                  'batch': lower.get('batch', ''),
                  'leetcode': lower.get('leetcode', '') or lower.get('leetcode username', ''),
                  'registerNumber': lower.get('registernumber', '') or lower.get('register number', ''),
                  'phone': lower.get('phone', ''),
              })

          payload = {
              'campusCode': os.environ['CAMPUS'],
              'dryRun': os.environ['DRY_RUN'] == 'true',
              'updateExisting': True,
              # Off unless explicitly asked for. A partial roster read as "archive everyone
              # else" would empty a campus from a twelve-row upload.
              'archiveAbsent': os.environ.get('ARCHIVE_ABSENT') == 'true',
              'rows': rows,
          }
          # Only sent when supplied. The endpoint creates a campus only when it is named,
          # so an absent name means "this campus must already exist" — which is what you
          # want for every import after the first.
          campus_name = os.environ.get('CAMPUS_NAME', '').strip()
          if campus_name:
              payload['campusName'] = campus_name
          with open('/tmp/payload.json', 'w') as handle:
              json.dump(payload, handle)
          # Count only — never the rows themselves.
          print(f"prepared {len(rows)} row(s) for campus {payload['campusCode']}, "
                f"dryRun={payload['dryRun']}")
          PY

          code=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
            --connect-timeout 30 --max-time 600 \
            -X POST "${base}/api/v1/internal/import-roster" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json || echo "000")

          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Import failed."
            # The body can echo a row, so print only the message.
            python3 -c "import json;d=json.load(open('/tmp/result.json'));print(d.get('message','(no message)'))" || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/result.json'))
          print(f"total rows : {r['totalRows']}")
          print(f"created    : {r['created']}")
          print(f"updated    : {r['updated']}")
          print(f"errors     : {len(r.get('errors', []))}")
          print(f"warnings   : {len(r.get('warnings', []))}")
          # Count only. `archived` carries each departing student's name, email and handle,
          # and this log is readable by anyone who can see the repository's Actions.
          if r.get('archived') is not None:
              print(f"archived   : {len(r['archived'])}  (ARCHIVED, not deleted — history kept)")
          for label, key in (('ERROR', 'errors'), ('WARN', 'warnings')):
              for item in r.get(key, []):
                  # Row number and reason only. `data` carries the student's own details.
                  print(f"  {label} row {item['row']} [{item.get('field')}]: {item['message']}")
          if r.get('createdSquads'):
              print(f"squads created: {', '.join(r['createdSquads'])}")
          if r.get('errors'):
              raise SystemExit('::error::Some rows could not be imported.')
          PY
