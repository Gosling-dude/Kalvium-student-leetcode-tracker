name: Daily Report Generation

# Generates the daily DSA assignment report and email, and leaves it PENDING_APPROVAL —
# it never sends anything. A mentor/admin still has to open Email Reports and click
# "Approve & Send". See docs/DAILY_EMAIL_REPORTING.md#approval-workflow.
#
# The job fails when the run generates nothing. That is not pedantry: this workflow spent
# days reporting success while producing no reports at all, because the endpoint answered
# HTTP 200 with an empty list when EMAIL_FROM was unset. A nightly automation that silently
# does nothing looks exactly like one that works.
#
# Scheduled to run after Nightly Rollup (19:00 UTC) so the day's DailyStatus rows are
# final before the report reads them. 19:20 UTC == 00:50 Asia/Kolkata. Adjust alongside
# rollup.yml if PROGRAM_TIMEZONE changes.
on:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
    inputs:
      dayKey:
        description: 'Program day to generate (YYYY-MM-DD). Leave blank for "yesterday".'
        required: false
        type: string

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-report:
    name: Trigger daily report generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${BACKEND_URL:-}" ] && { echo "::error::BACKEND_URL secret is not set"; missing=1; }
          [ -z "${CRON_SECRET:-}" ] && { echo "::error::CRON_SECRET secret is not set"; missing=1; }
          [ "$missing" -eq 1 ] && exit 1
          echo "Secrets present."

      - name: POST /internal/daily-report (with retries)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAY_KEY: ${{ inputs.dayKey }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}"
          url="${base}/api/v1/internal/daily-report"
          echo "Calling ${url}"

          if [ -n "${DAY_KEY:-}" ]; then
            body="{\"dayKey\":\"${DAY_KEY}\"}"
          else
            body='{}'
          fi

          attempts=5
          delay=10
          for i in $(seq 1 "$attempts"); do
            echo "::group::Attempt ${i}/${attempts}"
            http_code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
              --connect-timeout 30 --max-time 300 \
              -X POST "${url}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d "${body}" || echo "000")
            echo "HTTP ${http_code}"
            echo "Response body:"; cat /tmp/body.txt || true; echo
            echo "::endgroup::"

            if [ "$http_code" = "200" ]; then
              echo "Daily report generation triggered successfully."
              exit 0
            fi
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "::error::Unauthorized (${http_code}). Check the CRON_SECRET secret matches the backend."
              exit 1
            fi
            # 503 means the run completed and generated nothing — almost always EMAIL_FROM
            # / EMAIL_DEFAULT_TO missing on the server. Retrying cannot fix a missing
            # environment variable, and this is exactly the case that used to answer 200
            # with an empty result and show a green tick over an automation producing
            # nothing, every night, unnoticed.
            if [ "$http_code" = "503" ]; then
              echo "::error::The report run generated nothing. See the response body above — it names the reason."
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "::error::Daily report generation failed after ${attempts} attempts."
          exit 1
