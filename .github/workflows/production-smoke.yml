name: Production Smoke Test

# Verifies the *deployed* system, not the build.
#
# "The deploy succeeded" and "the data is correct" are different claims, and a build log
# can only ever demonstrate the first. This asserts on the second: that the API is up and
# reachable, that protected endpoints actually refuse anonymous callers, and that the live
# database satisfies the integrity invariants a release is responsible for keeping true
# (every student has a placement a report can see, no mentor logs in to an empty system,
# no scored day claims problems from an assignment that no longer exists).
#
# Runs on a schedule, after every push to main, and on demand.
#
# The schedule is the important one. This host's deploys land 30–70 minutes after a push,
# vary run to run, and skip intermediate commits (it deploys the latest, not each). That is
# measured, not assumed — it was observed repeatedly while building this. So "did *my*
# commit deploy" is a poor thing to gate a build on, while "is production correct right
# now" is worth asking continuously and answers the question that actually matters.
#
# On a push, then, a commit that has not deployed within the wait produces a **warning and
# a green run**: nothing was verified, and saying so is honest, whereas failing would mark
# a commit red for a deploy that succeeds forty minutes later and would train everyone to
# ignore the check. The assertions themselves are unchanged and still fail hard — on the
# scheduled run, and on any push whose commit did land.
#
# It reads production and writes nothing. The only credential it needs is CRON_SECRET,
# the same secret the sync and rollup workflows already use.
on:
  schedule:
    # Every half hour: often enough to catch a bad deploy quickly, rarely enough that a
    # long-lagging host still gets several clean readings between pushes.
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Verify the deployed system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${BACKEND_URL:-}" ] && { echo "::error::BACKEND_URL secret is not set"; missing=1; }
          [ -z "${CRON_SECRET:-}" ] && { echo "::error::CRON_SECRET secret is not set"; missing=1; }
          [ "$missing" -eq 1 ] && exit 1
          echo "Secrets present."

      - name: Wait for the deployment to come up
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}"

          # The free tier both cold-starts (~50s) and restarts on deploy. Poll rather than
          # sleep-and-hope: a fixed wait is either too short (flaky) or too long (slow) and
          # is never right.
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --connect-timeout 20 --max-time 90 "${base}/api/v1/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Healthy after ${i} attempt(s):"; cat /tmp/health.json; echo
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code}"
            sleep 15
          done
          echo "::error::Backend did not become healthy."
          exit 1

      - name: Wait for *this* commit to be the one that is deployed
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}"

          # A healthy /health proves *a* version is running, not that it is the one just
          # pushed. Without this the job races the host's build and reports on the previous
          # release — which is worse than not running, because it passes. The first attempt
          # at this waited for the integrity endpoint to merely *exist*, which distinguished
          # exactly one deploy and then silently stopped working; it verified the previous
          # build on the very next push.
          #
          # So the check is now identity, not existence: the process reports the commit it
          # is running (Render injects RENDER_GIT_COMMIT), and this waits for that to equal
          # the commit that triggered the run. 10 minutes covers a free-tier build and
          # restart; timing out means the deploy did not happen, which is itself the finding.
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              --connect-timeout 20 --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${base}/api/v1/internal/integrity" || echo "000")

            if [ "$code" = "200" ]; then
              deployed=$(python3 -c "import json;print(json.load(open('/tmp/probe.json')).get('commit') or '')")
              if [ -z "$deployed" ]; then
                # No commit to compare against. Two different situations look identical
                # from here: a build old enough to predate the field, which is mid-deploy
                # and about to be replaced, and a host that simply injects nothing. So this
                # waits a while before concluding the second — bailing on the first attempt
                # would let a still-deploying old build wave the run through.
                if [ "$i" -lt 8 ]; then
                  echo "attempt ${i}: no commit reported yet — the previous build may still be serving"
                  sleep 15
                  continue
                fi
                # Say so rather than looping for ten minutes and failing for something that
                # is not a real fault: the integrity assertions below still run, they just
                # cannot prove *which* build answered them.
                echo "::warning::The deployment reports no commit id, so this run cannot prove it tested the pushed build. Set GIT_COMMIT (or deploy on a host that injects RENDER_GIT_COMMIT)."
                exit 0
              fi
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                echo "Deployed commit matches ${EXPECTED_SHA}."
                exit 0
              fi
              echo "attempt ${i}: deployed ${deployed}, waiting for ${EXPECTED_SHA}"
            else
              echo "attempt ${i}: HTTP ${code} — the previous build does not serve this endpoint yet"
            fi
            sleep 15
          done

          # Not a failure. The commit has not deployed *yet*, which on this host is
          # ordinary — see the note at the top. The run goes green having verified nothing,
          # and says exactly that. The scheduled run is what keeps production honest.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "::warning::${EXPECTED_SHA:0:7} has not deployed yet, so this run verified nothing about it. The scheduled run checks production continuously."
            echo "SKIP_ASSERTIONS=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # On a schedule or a manual run there is no specific commit to wait for — assert
          # against whatever is serving.
          echo "::warning::Asserting against the currently deployed build rather than ${EXPECTED_SHA:0:7}."
          exit 0

      - name: Protected endpoints must refuse anonymous callers
        if: env.SKIP_ASSERTIONS != '1'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}/api/v1"
          failures=0

          # Authorization is enforced server-side or it is not enforced. Hiding a nav item
          # is not a control, so the check that matters is what an unauthenticated caller
          # actually receives from the endpoints holding student data.
          for path in students leaderboard assignments baseline-tests reports/daily admin/mentors internal/integrity; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "${base}/${path}" || echo "000")
            case "$code" in
              401|403) echo "  OK   ${path} -> ${code}" ;;
              *)       echo "::error::${path} returned ${code} to an anonymous caller (expected 401/403)"; failures=$((failures+1)) ;;
            esac
          done

          [ "$failures" -eq 0 ] || exit 1

      - name: Live data-integrity report
        if: env.SKIP_ASSERTIONS != '1'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${BACKEND_URL%/}"

          code=$(curl -sS -o /tmp/integrity.json -w '%{http_code}' \
            --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/v1/internal/integrity" || echo "000")

          if [ "$code" != "200" ]; then
            echo "::error::integrity endpoint returned ${code}"
            cat /tmp/integrity.json || true
            exit 1
          fi

          python3 - <<'PY'
          import json, sys

          with open('/tmp/integrity.json') as handle:
              report = json.load(handle)

          roster, sync, content = report['roster'], report['sync'], report['content']

          print(f"Program day       {report['programDay']}")
          print(f"Students          {roster['activeStudents']} active of {roster['totalStudents']}")
          print(f"  with a handle   {roster['studentsWithLeetcodeUsername']}")
          print(f"Campuses/batches  {roster['campuses']} / {roster['batches']}")
          print(f"  without email   {roster.get('studentsWithoutEmail', 0)}  (no portal login until supplied)")
          print(f"Last good sync    {sync['lastSuccessfulSyncAt']}")
          print(f"Sync status       {sync['byStatus']}")
          print(f"Assignments       {content['assignments']} (latest {content['latestAssignmentDay']})")
          print(f"Baseline tests    {content['baselineTests']}")
          print(f"Submissions       {content['submissions']}")
          print(f"Email pending     {report['email']['pendingApproval']}")
          print()

          # Squad membership, so a roster import is verifiable from outside the database.
          squads = roster.get('squads') or []
          if squads:
              print("Squads (active students):")
              for squad in squads:
                  campus = squad.get('campusCode') or '—'
                  print(f"  {squad['activeStudents']:>4}  {squad['name']}  [{campus}]")
              print()

          # Participation records beside what the submission mirror actually holds. These
          # two disagreeing is a reporting bug, not missing data, and the difference is only
          # visible when both are printed together.
          for test in report.get('baseline', []):
              print(f"Baseline \"{test['name']}\" ({test['dayKey']})")
              print(f"  eligible {test['eligibleStudents']}  attempts {test['attempts']}  "
                    f"problems {test['problems']}")
              print(f"  students holding an accepted solution: {test['studentsWithAnyAcceptedSolution']}"
                    f"  (accepted submissions: {test['acceptedSubmissions']})")
              for problem in test['perProblem']:
                  print(f"    {problem['solvedByStudents']:>4}  {problem['titleSlug']}")

              # What the product reports, beside the raw counts above. These agreeing is
              # the fix working; the leaderboard reading 0 while the mirror shows solutions
              # is the bug, and printing only one of the two hides it.
              board = test.get('leaderboard')
              if board:
                  print(f"  leaderboard: {board['studentsWithAtLeastOneSolved']} student(s) with >=1 solved, "
                        f"{board['solvedAllCount']} solved all, avg {board['averagePercent']}%, "
                        f"{board['performanceUnknownStudents']} not synced")
                  print(f"  distribution (n solved -> students): {board['distribution']}")
                  mirrored = test['studentsWithAnyAcceptedSolution']
                  if mirrored > 0 and board['studentsWithAtLeastOneSolved'] == 0:
                      print(f"::error::Baseline \"{test['name']}\" reports 0 students solving anything "
                            f"while the mirror holds accepted solutions for {mirrored}. "
                            f"Performance is being read off participation again.")
                      sys.exit(1)
          if report.get('baseline'):
              print()

          # Data failures block; configuration gaps are surfaced every run but do not fail
          # the build. Mixing them would leave this permanently red over an environment
          # variable nobody can set today — and a check that is always red is one nobody
          # reads, so the next real data regression would scroll straight past.
          raised = [f for f in report['findings'] if f['shouldBeZero'] and f['count'] > 0]
          failed = [f for f in raised if f.get('severity', 'data') == 'data']
          warned = [f for f in raised if f.get('severity', 'data') != 'data']

          for finding in report['findings']:
              mark = 'FAIL' if finding in failed else 'WARN' if finding in warned else 'ok  '
              print(f"{mark}  {finding['check']} = {finding['count']}")
              if finding in raised:
                  print(f"      {finding['detail']}")

          for finding in warned:
              print(f"::warning::{finding['check']} = {finding['count']} — {finding['detail']}")

          if failed:
              print()
              for finding in failed:
                  print(f"::error::{finding['check']} = {finding['count']} — {finding['detail']}")
              sys.exit(1)

          # An empty roster is not an integrity violation, but it is never what production
          # should look like after onboarding, so it is worth surfacing rather than passing
          # silently on a database that lost its students.
          if roster['activeStudents'] == 0:
              print("::warning::No active students in production.")

          print("\nAll integrity checks passed.")
          PY
