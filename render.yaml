# =============================================================================
# Render Blueprint — DSA Tracker
#
# Provisions the whole stack from this repo:
#
#   • dsa-db      — managed PostgreSQL (the app's only stateful dependency)
#   • dsa-api     — NestJS API (web service, binds Render's $PORT on 0.0.0.0)
#   • dsa-web     — Next.js frontend (web service running `next start`)
#   • dsa-sync    — cron job: incremental LeetCode sync, several times a day
#   • dsa-rollup  — cron job: nightly leaderboard/streak rebuild + housekeeping
#
# Why a Web Service (not a Static Site) for the frontend:
#   the app has a runtime dynamic route (`/students/[id]`) and uses Next's image
#   optimizer, both of which require the Next server — a static export would drop
#   features. It is client-rendered, so it still runs comfortably on a small instance.
#
# Why cron jobs (not the in-process scheduler) for sync/rollup:
#   the API's built-in scheduler only fires while the API process is awake. Dedicated
#   cron jobs fire on schedule regardless, so scheduled syncs keep working even if the
#   web service is suspended when idle. The API therefore runs with SYNC_ENABLED=false.
#
# TWO env vars must be set by hand after the first deploy (they cross-reference each
# other's public URL, which does not exist until the service is created):
#   • dsa-api   CORS_ORIGINS        -> https://<dsa-web url>
#   • dsa-web   NEXT_PUBLIC_API_URL -> https://<dsa-api url>/api/v1   (see note below)
# NEXT_PUBLIC_API_URL is compiled into the frontend at BUILD time, so after setting it
# you must trigger a fresh deploy of dsa-web. See docs/DEPLOY_RENDER.md for the order.
#
# Do NOT add a PORT variable to any service — Render injects it and the apps read it.
# Instance plans below are left at Render's default; pick the tier you want in the
# dashboard. Verify current plan availability and pricing on Render — this file makes
# no assumptions about which tiers are free.
# =============================================================================

databases:
  - name: dsa-db
    databaseName: dsa_tracker
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: dsa-api
    runtime: node
    rootDir: .
    # Build the shared domain package first, generate the Prisma client, then compile
    # the API. `prisma migrate deploy` applies any pending migrations here (idempotent,
    # and DATABASE_URL is already injected at build time) so the schema is ready before
    # the first request. The seed then creates the first admin — in production it creates
    # ONLY the admin, scoring formula and problem catalogue (the demo cohort is never
    # seeded in production), it is idempotent, and it never resets an existing admin's
    # password. Doing it in the build guarantees a login even on plans without Shell
    # access. See docs/DEPLOY_RENDER.md to run migrate/seed manually instead.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build:shared &&
      npm run db:generate -w @dsa/api &&
      npm run db:migrate -w @dsa/api &&
      npm run db:seed -w @dsa/api &&
      npm run build -w @dsa/api
    startCommand: npm run start -w @dsa/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-db
          property: connectionString
      # No Redis in this blueprint: the inline driver runs sync work in-process, and the
      # cache falls back to memory automatically. Add a Render Key Value (Redis) instance
      # and set QUEUE_DRIVER=bullmq + REDIS_URL if you later run multiple API instances.
      - key: QUEUE_DRIVER
        value: inline
      - key: CACHE_ENABLED
        value: "true"
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: "false"
      # Scheduled work runs in the dsa-sync / dsa-rollup cron jobs, not in-process.
      - key: SYNC_ENABLED
        value: "false"
      # Generated by Render (min length enforced); each is distinct.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      # First-admin credentials. CHANGE SEED_ADMIN_PASSWORD in the dashboard before the
      # first deploy, then change it again from the UI after signing in.
      - key: SEED_ADMIN_EMAIL
        value: admin@kalvium.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Program Admin
      - key: PROGRAM_TIMEZONE
        value: Asia/Kolkata
      - key: PROBLEMS_PER_DAY
        value: "4"
      - key: LEETCODE_GRAPHQL_ENDPOINT
        value: https://leetcode.com/graphql
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      # MANUAL: set to the deployed frontend origin, e.g. https://dsa-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: dsa-web
    runtime: node
    rootDir: .
    buildCommand: >-
      npm ci --include=dev &&
      npm run build:shared &&
      npm run build -w @dsa/web
    startCommand: npm run start -w @dsa/web
    envVars:
      - key: NODE_ENV
        value: production
      # MANUAL + REBUILD REQUIRED: this is inlined into the client bundle at build time.
      # Set to https://<dsa-api url>/api/v1, then trigger a new deploy of dsa-web.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: DSA Tracker

  # ---------------------------------------------------------------------------
  # Cron: incremental sync. Render cron schedules are UTC.
  # Every 3 hours mirrors the local default and keeps LeetCode's 20-row submission
  # window from overflowing between runs.
  # ---------------------------------------------------------------------------
  - type: cron
    name: dsa-sync
    runtime: node
    rootDir: .
    schedule: "0 */3 * * *"
    buildCommand: >-
      npm ci --include=dev &&
      npm run build:shared &&
      npm run db:generate -w @dsa/api &&
      npm run build -w @dsa/api
    startCommand: npm run cron:sync -w @dsa/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-db
          property: connectionString
      - key: QUEUE_DRIVER
        value: inline
      - key: SYNC_ENABLED
        value: "false"
      - key: PROGRAM_TIMEZONE
        value: Asia/Kolkata
      - key: PROBLEMS_PER_DAY
        value: "4"
      - key: LEETCODE_GRAPHQL_ENDPOINT
        value: https://leetcode.com/graphql
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      # A cron process boots the full app context; give it valid (any) JWT secrets so
      # config validation passes. It never issues tokens, so these need not match the API.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # Cron: nightly rollup. 19:00 UTC == 00:30 Asia/Kolkata, so it runs just after the
  # program day closes and finalises *yesterday*.
  # ---------------------------------------------------------------------------
  - type: cron
    name: dsa-rollup
    runtime: node
    rootDir: .
    schedule: "0 19 * * *"
    buildCommand: >-
      npm ci --include=dev &&
      npm run build:shared &&
      npm run db:generate -w @dsa/api &&
      npm run build -w @dsa/api
    startCommand: npm run cron:rollup -w @dsa/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dsa-db
          property: connectionString
      - key: QUEUE_DRIVER
        value: inline
      - key: SYNC_ENABLED
        value: "false"
      - key: PROGRAM_TIMEZONE
        value: Asia/Kolkata
      - key: PROBLEMS_PER_DAY
        value: "4"
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
